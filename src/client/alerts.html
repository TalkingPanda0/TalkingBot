<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="" />
    <style>
      .sender {
        color: cyan;
      }
      #alert {
        background-color: rgba(0, 0, 0, 0.5);
        position: relative;
        opacity: 0%;
        transition: opacity 1s ease-in-out;
        text-align: center;
        display: inline-block;
        padding: 50px;
      }
      .message {
        font-size: 50px;
      }
      * {
        position: relative;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 60px;
        color: white;
      }
      .bab {
        z-index: 1;
      }
      .follow {
        padding-bottom: 10px;
      }
      #exp0 {
        position: absolute;
        z-index: 2;
        left: 50%;
        transform: translate(-50%, 0%);
      }
      #exp1 {
        position: absolute;
        z-index: 3;
        left: 50%;
        transform: translate(-70%, 0%);
      }
      #exp2 {
        position: absolute;
        z-index: 4;
        left: 50%;
        transform: translate(-20%, 0%);
      }

      .text {
        color: white;
      }
      .message {
        top: 1050px;
      }
    </style>
  </head>
  <body>
    <div id="container" />

    <div id="alert"></div>

    <script type="module" src="/script/alerts.ts"></script>
  </body>
</html>
