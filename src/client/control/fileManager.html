<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      body {
        font-family: Roboto, Arial, sans-serif;
        padding: 5px;
        background-color: #15171c;
        color: lightgray;
      }

      .button {
        cursor: pointer;
        user-select: none;
      }

      .file-icon {
        user-select: none;
        color: white;
        width: 48px;
        height: 48px;
      }

      .file {
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        gap: 5px;
        width: 100%;
        min-width: 0;
        padding: 4px 6px;
        border: 2px solid transparent;
        border-radius: 5px;
        box-sizing: border-box;
      }

      span.file-icon {
        font-size: 48px;
        font-variation-settings: "OPSZ" 48;
      }

      .filegrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 10px;
      }

      .file:hover {
        border-color: lightblue;
      }

      .selected {
        border-color: #048ac7;
      }

      .selected .file-icon {
        color: #048ac7;
      }

      .dividerRight {
        border-right: solid 1px grey;
        padding-right: 10px;
        margin-right: 10px;
      }

      .header * {
        color: white;
      }
      .header {
        display: flex;
        padding-left: 20px;
        gap: 20px;
        padding-bottom: 10px;
        border-bottom: solid 1px grey;
      }

      .name {
        width: 100%;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <template id="fileTemplate">
      <div class="file">
        <span class="material-symbols-outlined file-icon">folder_open</span>
        <span class="name">Sounds</span>
      </div>
    </template>

    <div class="header">
      <span class="material-symbols-outlined file-icon button" id="editButton"
        >edit</span
      >
      <span
        class="material-symbols-outlined file-icon dividerRight button"
        id="downloadButton"
        >download</span
      >

      <span class="material-symbols-outlined file-icon button" id="renameButton"
        >drive_file_rename</span
      >
      <span
        class="material-symbols-outlined file-icon dividerRight button"
        id="deleteButton"
        >delete</span
      >

      <span class="material-symbols-outlined file-icon button" id="uploadButton"
        >upload</span
      >
      <span
        class="material-symbols-outlined file-icon button"
        id="newFileButton"
        >note_add</span
      >
      <span
        class="material-symbols-outlined file-icon button"
        id="newFolderButton"
        >create_new_folder</span
      >
    </div>
    <br />
    <div class="filegrid" id="fileGrid"></div>
    <script type="module" src="/control/script/fileManager.ts"></script>
  </body>
</html>
