<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
  </head>
  <body>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=cloud_done"
    />

    <div
      id="container"
      style="width: 100%; height: 97vh; border: 1px solid grey"
    ></div>
    <span id="loading">
      <div id="throbber" class="hidden"></div>
      <span id="check" class="material-symbols-outlined hidden">
        cloud_done
      </span>
    </span>

    <script type="module" src="/control/script/editModule.ts"></script>
  </body>

  <style>
    #loading {
      position: absolute;
      right: 25px;
      bottom: 15px;
      z-index: 5;
    }

    #throbber {
      width: 48px;
      height: 48px;
      border: 5px solid #fff;
      border-bottom-color: #048ac7;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }
    @keyframes rotation {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    .hidden {
      display: none !important;
    }
    #check {
      color: #048ac7;
      font-size: 48px;
    }

    body {
      background-color: #1e1e1e;
    }
    #message-apperance {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #message-apperance * {
      flex: 1;
    }

    #message-input {
      flex: 1;
    }
    .button {
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
    }
    #send-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #send-message {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
    }
    .input {
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    #container2 * {
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 25px;
      font-weight: 700;
      line-height: 1em;
      background-color: #1e1e1e;
    }
  </style>
</html>
