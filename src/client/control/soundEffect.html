<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sound Effects Manager</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 5px;
        background-color: #15171c;
        color: white;
      }

      * {
        font-family: Roboto, Arial, sans-serif;
      }

      ul {
        list-style-type: none;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 15px;
      }

      li {
        background-color: #1e2128;
        border: 1px solid #3a3f4b;
        border-radius: 8px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      li p {
        margin: 5px 0;
        font-weight: bold;
        text-align: center;
        word-break: break-word;
      }

      li audio {
        margin: 8px 0;
        width: 100%;
      }
      .button::hover {
        color: red;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-evenly;
        width: 100%;
      }
      .button {
        cursor: pointer;
        user-select: none;
      }
      input {
        margin: 10px;
      }
      .name {
        width: 95%;
        padding: 5px;
      }
      form {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Sound Effects Manager</h1>

    <form
      action="/api/soundEffects/add"
      method="POST"
      enctype="multipart/form-data"
    >
      <input
        class="name"
        type="text"
        placeholder="Text to be replaced by sound."
        name="name"
        required
      />
      <br />
      <input type="file" name="sound" required />
      <button type="submit">Upload File</button>
    </form>

    <ul id="list"></ul>

    <script type="module" src="/control/script/soundEffect.ts"></script>
  </body>
</html>
